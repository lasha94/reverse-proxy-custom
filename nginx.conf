worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;

    # 1. HTTP-დან HTTPS-ზე გადამისამართება ყველა დომენისთვის
    server {
        listen 80;
        server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN} ${TERTIARY_DOMAIN};
        return 301 https://$host$request_uri;
    }

    # 2. სტანდარტული HTTPS სერვერი (443 პორტი)
    server {
        listen 443 ssl;
        server_name ${PRIMARY_DOMAIN} ${SECONDARY_DOMAIN} ${TERTIARY_DOMAIN};

        ssl_certificate ${CERT_DIR}/proxy.crt;
        ssl_certificate_key ${CERT_DIR}/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            add_header Content-Type text/plain;
            return 200 "STATUS=1\nLICENSE=ACTIVE\nKEY=LAB-TEST-LICENSE-KEY\nIP=$remote_addr\n";
        }

        location /cpanel.txt {
            add_header Content-Type text/plain;
            return 200 "STATUS=1\n";
        }

        location /xml-api/ {
            add_header Content-Type text/xml;
            return 200 "<?xml version=\"1.0\"?><cpanelresult><status>1</status><statusmsg>License Valid</statusmsg></cpanelresult>";
        }
    }

    # 3. სპეციალური cPanel ავთენტიფიკაციის პორტი (2089 პორტი) - გაჭედვის საწინააღმდეგო ფიქსი
    server {
        listen 2089 ssl default_server;
        server_name _; # იჭერს ნებისმიერ მოთხოვნას (მათ შორის 208.74.123.2 IP-ზე მოსულს)

        ssl_certificate ${CERT_DIR}/proxy.crt;
        ssl_certificate_key ${CERT_DIR}/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            add_header Content-Type text/plain;
            return 200 "STATUS=1\nLICENSE=ACTIVE\nKEY=LAB-TEST-LICENSE-KEY\nIP=$remote_addr\nPROD=cpanel\n";
        }
    }
}

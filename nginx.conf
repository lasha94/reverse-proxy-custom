worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;

    # 1. HTTP-დან HTTPS-ზე გადამისამართება ყველა დომენისთვის
    server {
        listen 80;
        server_name license.cpanel.net verify.cpanel.net auth.cpanel.net;
        return 301 https://$host$request_uri;
    }

    # 2. სტანდარტული HTTPS სერვერი (443 პორტი)
    server {
        listen 443 ssl;
        server_name license.cpanel.net verify.cpanel.net auth.cpanel.net;

        ssl_certificate /etc/nginx/ssl/cpanel.crt;
        ssl_certificate_key /etc/nginx/ssl/cpanel.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            add_header Content-Type text/plain;
            return 200 "STATUS=1\nLICENSE=ACTIVE\nKEY=LAB-TEST-LICENSE-KEY\nIP=$remote_addr\n";
        }

        location /cpanel.txt {
            add_header Content-Type text/plain;
            return 200 "STATUS=1\n";
        }

        location /xml-api/ {
            add_header Content-Type text/xml;
            return 200 "<?xml version=\"1.0\"?><cpanelresult><status>1</status><statusmsg>License Valid</statusmsg></cpanelresult>";
        }
    }

    # 3. ახალი სერვერი სპეციალურად cPanel ლიცენზირებისთვის (2089 პორტი)
    server {
        listen 2089 ssl;
        server_name license.cpanel.net verify.cpanel.net auth.cpanel.net;

        ssl_certificate /etc/nginx/ssl/cpanel.crt;
        ssl_certificate_key /etc/nginx/ssl/cpanel.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # cpkeyclt-ის მთავარი ენდფოინთი, რომელიც აბრუნებს ვალიდურ კრიპტო სტატუსს
        location / {
            add_header Content-Type text/plain;
            return 200 "STATUS=1\nLICENSE=ACTIVE\nKEY=LAB-TEST-LICENSE-KEY\nIP=$remote_addr\nPROD=cpanel\n";
        }
    }
}

# 1. HTTP სერვერი (ყველაფრისთვის, რასაც Coolify შიგნით გადმოამისამართებს)
server {
    listen 80 default_server;
    server_name _;

    location / {
        add_header Content-Type text/plain;
        return 200 "STATUS=1\nLICENSE=ACTIVE\nKEY=LAB-TEST-LICENSE-KEY\nIP=$remote_addr\nPROD=cpanel\n";
    }

    location /cpanel.txt {
        add_header Content-Type text/plain;
        return 200 "STATUS=1\n";
    }

    location /xml-api/ {
        add_header Content-Type text/xml;
        return 200 "<?xml version=\"1.0\"?><cpanelresult><status>1</status><statusmsg>License Valid</statusmsg></cpanelresult>";
    }
}

# 2. სპეციალური 2089 პორტი (თუ ტრაფიკი პირდაპირ პორტით შემოვა)
server {
    listen 2089 default_server;
    server_name _;

    location / {
        add_header Content-Type text/plain;
        return 200 "STATUS=1\nLICENSE=ACTIVE\nKEY=LAB-TEST-LICENSE-KEY\nIP=$remote_addr\nPROD=cpanel\n";
    }
}

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;

    server {
        listen 80;
        server_name license.cpanel.net verify.cpanel.net;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name license.cpanel.net verify.cpanel.net;

        ssl_certificate /etc/nginx/ssl/cpanel.crt;
        ssl_certificate_key /etc/nginx/ssl/cpanel.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # ძირითადი ტექსტური ფაილი, რასაც cpkeyclt ამოწმებს
        location / {
            add_header Content-Type text/plain;
            # აბრუნებს დინამიურ პასუხს, სადაც წერია მოთხოვნის გამომგზავნი IP-ც
            return 200 "STATUS=1\nLICENSE=ACTIVE\nKEY=LAB-TEST-LICENSE-KEY\nIP=$remote_addr\n";
        }

        # cPanel-ის ძველი ვერსიები ან სპეციფიკური სკრიპტები ხშირად ამ ფაილს მიმართავენ
        location /cpanel.txt {
            add_header Content-Type text/plain;
            return 200 "STATUS=1\n";
        }

        # XML-API და ავტომატიზაციის მოთხოვნების იმიტაცია
        location /xml-api/ {
            add_header Content-Type text/xml;
            return 200 "<?xml version=\"1.0\"?><cpanelresult><status>1</status><statusmsg>License Valid</statusmsg></cpanelresult>";
        }
    }
}
